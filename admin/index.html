<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>内容管理 · 时空人公益推广</title>
<link rel="stylesheet" href="/style.css">
<style>
  body{background:#faf8f4}
  .gate{max-width:560px;margin:0 auto;padding:48px 20px 80px;color:#333}
  .gate h1{font-size:22px;font-weight:600;margin:0 0 6px}
  .gate .sub{font-size:14px;color:#777;margin:0 0 28px;line-height:1.8}
  .card{background:#fff;border:1px solid #e8e0d4;border-radius:10px;padding:24px;margin-bottom:18px}
  .card h2{font-size:15px;font-weight:600;margin:0 0 12px}
  label{display:block;font-size:13px;color:#666;margin:0 0 6px}
  textarea{width:100%;box-sizing:border-box;height:84px;padding:10px;border:1px solid #d8cfc0;
    border-radius:6px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical;background:#fdfcfa}
  textarea:focus{outline:none;border-color:#8a5a1a;background:#fff}
  button{font:inherit;cursor:pointer;border:none;border-radius:6px;padding:11px 20px;font-size:14px;font-weight:500}
  .btn-primary{background:#8a5a1a;color:#fff;width:100%;margin-top:14px}
  .btn-primary:hover{background:#74491a}
  .btn-primary:disabled{background:#c8b49a;cursor:not-allowed}
  .btn-ghost{background:#f0ebe2;color:#6b5233;width:100%;margin-top:10px}
  .btn-ghost:hover{background:#e6dfd2}
  .msg{margin-top:12px;font-size:13px;line-height:1.7;padding:10px 12px;border-radius:6px;display:none}
  .msg.err{background:#fdeeee;color:#a12d2d;border:1px solid #f2c9c9;display:block}
  .msg.ok{background:#eef7ee;color:#2d6b2f;border:1px solid #c9e2ca;display:block}
  .steps{font-size:13px;color:#555;line-height:1.9;margin:0;padding-left:20px}
  .steps li{margin-bottom:9px}
  .steps a{color:#8a5a1a}
  .steps code{background:#f4efe7;padding:1px 5px;border-radius:3px;font-size:12px;
    font-family:ui-monospace,Menlo,Consolas,monospace}
  details{margin-top:12px;font-size:13px}
  summary{cursor:pointer;color:#8a5a1a;user-select:none}
  hr{border:none;border-top:1px solid #ece5d9;margin:22px 0}
  .tip{font-size:12px;color:#999;line-height:1.8;margin-top:10px}
</style>
</head>
<body>
<div class="gate" id="gate">
  <h1>内容管理后台</h1>
  <p class="sub">时空人公益推广 · 仅限管理员登录</p>

  <div class="card">
    <h2>登录方式：粘贴访问令牌</h2>
    <label for="tok">GitHub Personal Access Token</label>
    <textarea id="tok" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off" spellcheck="false"></textarea>
    <button class="btn-primary" id="btn">验证并进入后台</button>
    <div class="msg" id="msg"></div>
    <details>
      <summary>如何获取令牌？</summary>
      <ol class="steps">
        <li>打开 <a href="https://github.com/settings/tokens/new" target="_blank" rel="noopener">github.com/settings/tokens/new</a></li>
        <li>Note 填 <code>shikongren</code>，Expiration 选 90 days 或更长</li>
        <li>勾选权限 <code>repo</code>（读写仓库）——只需这一项</li>
        <li>滑到底点 Generate token，复制那串 <code>ghp_</code> 开头的字符</li>
        <li>粘贴到上面输入框，点按钮</li>
      </ol>
      <p class="tip">令牌只存在你自己的浏览器里（localStorage），不会发给除 GitHub 以外的任何人。</p>
    </details>
  </div>

  <p style="text-align:center;margin-top:26px">
    <a href="/" style="color:#8a5a1a;font-size:13px;text-decoration:none">← 返回站点</a>
    &nbsp;·&nbsp;
    <a href="/admin/guide.html" style="color:#8a5a1a;font-size:13px;text-decoration:none">使用说明</a>
  </p>
</div>

<script>
(function () {
  var KEY = 'decap-cms-user';
  var BACKEND = 'github';
  var REPO = 'yiwucart/shikongren';

  var gate = document.getElementById('gate');
  var tokEl = document.getElementById('tok');
  var btn = document.getElementById('btn');
  var msg = document.getElementById('msg');

  function say(text, kind) {
    msg.className = 'msg ' + (kind || 'err');
    msg.textContent = text;
  }

  function save(token, login) {
    var user = {
      token: token,
      backendName: BACKEND,
      provider: 'github',
      login: login,
      name: login
    };
    try { localStorage.setItem(KEY, JSON.stringify(user)); } catch (e) {}
  }

  function bootCMS() {
    // 移除登录门，然后动态载入 Decap —— 它会自动读取 /admin/config.yml
    // 并从 localStorage 恢复登录态。
    if (gate && gate.parentNode) gate.parentNode.removeChild(gate);
    var s = document.createElement('script');
    s.src = '/admin/decap-cms.js';
    s.onerror = function () { alert('编辑器脚本加载失败，请刷新页面重试。'); };
    document.body.appendChild(s);
  }

  function verify(token) {
    return fetch('https://api.github.com/user', {
      headers: { Authorization: 'token ' + token, Accept: 'application/vnd.github+json' }
    }).then(function (r) {
      if (!r.ok) {
        if (r.status === 401) throw new Error('令牌无效或已过期，请重新生成。');
        throw new Error('无法连接 GitHub（HTTP ' + r.status + '），请检查网络。');
      }
      return r.json();
    }).then(function (me) {
      return fetch('https://api.github.com/repos/' + REPO, {
        headers: { Authorization: 'token ' + token, Accept: 'application/vnd.github+json' }
      }).then(function (r2) {
        if (!r2.ok) throw new Error('该账号无权访问仓库 ' + REPO + '。');
        return r2.json();
      }).then(function () {
        return me;
      });
    });
  }

  btn.addEventListener('click', function () {
    var token = (tokEl.value || '').trim();
    if (!token) { say('请先粘贴令牌。'); return; }
    btn.disabled = true;
    say('正在验证…', 'ok');
    verify(token).then(function (me) {
      save(token, me.login);
      say('验证通过，正在进入后台…', 'ok');
      setTimeout(bootCMS, 400);
    }).catch(function (e) {
      btn.disabled = false;
      say(e.message || String(e));
    });
  });

  tokEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) btn.click();
  });

  // 已经有有效登录态就直接进后台
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && saved.backendName === BACKEND && saved.token) bootCMS();
  } catch (e) {}
})();
</script>
</body>
</html>
