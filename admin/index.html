<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>内容管理 · 时空人公益推广</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- Decap CMS 会自动挂载到 body；这里不要放自定义容器，否则会干扰它渲染 -->
<script src="/admin/decap-cms.js"></script>
<script>
(function () {
  // 仅在脚本完全没加载起来时给出可读提示，不干扰 Decap 自身渲染
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (typeof CMS === 'undefined') {
        document.body.insertAdjacentHTML('afterbegin',
          '<div style="max-width:680px;margin:60px auto;padding:20px;font-size:14px;' +
          'color:#8a5a1a;background:#fdf6ee;border:1px solid #f0dcc4;border-radius:8px;' +
          'line-height:1.8">编辑器脚本加载失败，请刷新页面重试。若持续失败，请把 ' +
          'https://shikongren.com/admin/ 这个地址发给管理员。</div>');
      }
    }, 4000);
  });
})();
</script>
</body>
</html>
